# =============================================================================
# feeds.yaml — source + watch config for the Daily News Digest
# Consumed by digest.py (keys: google_news, federal_register, rss, watch)
# Beats are mapped to the formulary categories:
#   HRT/TRT · Peptides · GLP-1 / Weight Loss · Sexual Health · Hair Loss ·
#   Skincare (Cosmetic) · Wellness / Anti-Aging · Compounding/FDA · Telehealth
#
# Tuning notes:
#   - Google News queries use quotes to keep phrases together; keep them tight
#     to limit noise. Claude scores relevance 1-5, MIN_SCORE filters the page.
#   - Verify each RSS url returns XML before relying on it (some FDA feeds move).
#   - The `watch` list force-promotes any story matching its keywords to score 5
#     and surfaces it in the standing watch panel even on quiet days.
# =============================================================================

google_news:
  # --- Compounding / FDA regulatory (central to the whole portfolio) ---
  - '"compounding pharmacy" FDA'
  - '"503A" OR "503B" compounding'
  - '"bulks list" compounding FDA'
  - 'Pharmacy Compounding Advisory Committee PCAC'
  - 'compounded drug FDA warning letter'
  - 'Alliance for Pharmacy Compounding'
  - '"demonstrably difficult to compound"'

  # --- GLP-1 / medical weight loss ---
  - 'compounded semaglutide'
  - 'compounded tirzepatide'
  - 'semaglutide tirzepatide 503B bulks list'
  - 'GLP-1 compounding FDA'
  - 'GLP-1 weight loss telehealth FDA'
  - 'liraglutide compounding'
  - 'phentermine weight loss'
  - 'metformin weight loss longevity'

  # --- Peptides ---
  - 'BPC-157 FDA'
  - 'TB-500 thymosin beta-4 compounding'
  - 'compounded peptides FDA 503A'
  - 'KPV OR "MOTS-c" peptide FDA'
  - 'CJC-1295 ipamorelin'
  - 'tesamorelin'
  - 'GHK-Cu copper peptide'
  - 'sermorelin OR ipamorelin peptide therapy'
  - 'IGF-1 LR3 peptide'

  # --- HRT / TRT ---
  - 'testosterone replacement therapy FDA'
  - 'TRAVERSE testosterone trial'
  - 'compounded testosterone'
  - 'estradiol patch shortage'
  - 'menopause hormone therapy FDA'
  - 'bioidentical hormone therapy compounding'
  - 'enclomiphene OR clomiphene testosterone'
  - 'anastrozole estrogen men'
  - 'compounded thyroid liothyronine NDMA'

  # --- Sexual health ---
  - 'bremelanotide PT-141'
  - 'compounded sildenafil OR tadalafil'
  - 'Trimix erectile dysfunction compounding'
  - 'oxytocin compounded sexual health'

  # --- Hair loss ---
  - 'compounded topical finasteride FDA'
  - 'oral minoxidil hair loss'
  - 'dutasteride hair loss'
  - 'finasteride side effects FDA'

  # --- Skincare / cosmetic ---
  - 'hydroquinone FDA OR shortage'
  - 'compounded tretinoin'
  - 'compounded skincare prescription'

  # --- Wellness / anti-aging ---
  - 'NAD+ therapy'
  - 'methylene blue supplement FDA'
  - 'glutathione injection'
  - 'low-dose naltrexone LDN'
  - 'compounded ketamine telehealth'

  # --- Telehealth competitors ---
  - 'Hims Hers compounded'
  - 'Ro telehealth weight loss'
  - 'Novo Nordisk Hims compounding'
  - 'telehealth compounded drug lawsuit'

federal_register:
  # FDA agency filter is applied in digest.py; these are the search terms.
  - 'semaglutide'
  - 'tirzepatide'
  - 'liraglutide'
  - 'bulk drug substances compounding'
  - 'Pharmacy Compounding Advisory Committee'
  - '503A'
  - '503B outsourcing facility'
  - 'testosterone'
  - 'estradiol'
  - 'compounding'
  - 'peptide'
  - 'finasteride'
  - 'hydroquinone'

rss:
  # Verify each URL returns XML before trusting it; FDA occasionally relocates feeds.
  - name: FDA Press Announcements
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
  - name: FDA MedWatch Safety Alerts
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/medwatch/rss.xml
  - name: FDA Recalls
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/recalls/rss.xml
  - name: FDA Drug Safety Communications
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/drugs/rss.xml
  # Trade/industry (optional — add or remove as you like):
  # - name: Alliance for Pharmacy Compounding
  #   url: https://a4pc.org/feed/

# -----------------------------------------------------------------------------
# Standing watch list — high-stakes items kept visible until they resolve.
# Any ingested story whose text contains a keyword is promoted to score 5 and
# shown in the watch panel. Review the `note` text periodically and prune items
# once the regulatory event has passed.
# -----------------------------------------------------------------------------
watch:
  - label: "GLP-1 503B bulks exclusion — semaglutide / tirzepatide / liraglutide"
    keywords: ["503B bulks", "bulks list", "semaglutide", "tirzepatide", "liraglutide", "GLP-1 compounding"]
    note: >
      UPDATE (Aug 2026): Public comment on FDA's proposal to permanently exclude
      these three from the 503B bulks list CLOSED July 30, 2026. FDA is now reviewing
      comments; no final rule and no announced timeline. Still the highest enforcement
      exposure in the portfolio — watch for the final determination.

  - label: "Peptide line — PCAC recommended 4 key peptides for the 503A bulks list"
    keywords: ["BPC-157", "TB-500", "thymosin", "KPV", "MOTS-c", "PCAC", "Pharmacy Compounding Advisory", "Semax", "Epitalon"]
    note: >
      UPDATE (Jul 23-24, 2026 PCAC): The committee voted to RECOMMEND BPC-157, KPV,
      TB-500 (8-6) and MOTS-c (7-5) for the 503A bulks list — plus Semax and Epitalon;
      it rejected DSIP/emideltide. Important: this is only a recommendation. It does
      NOT change legal status or make them compoundable yet — FDA must still issue a
      final decision, and no deadline has been announced. Still a gray zone until then.

  - label: "Compounded topical finasteride — informed-consent risk"
    keywords: ["topical finasteride", "finasteride", "minoxidil finasteride"]
    note: >
      Status unchanged (as of Aug 2026): FDA's Apr 2025 adverse-event alert remains in
      effect (ED, depression, suicidal ideation, brain fog; some persisting after
      discontinuation). Still no FDA-approved topical labeling. Keep documenting
      side-effect counseling and pregnancy-transfer warnings.

  - label: "Estradiol patch shortage — HRT demand surge"
    keywords: ["estradiol patch", "estrogen patch", "menopause hormone", "HRT shortage"]
    note: >
      Still unresolved (Aug 2026): all major brands (Climara, Vivelle-Dot, Teva/Mylan
      generics) remain backordered; ASHP is tracking it though FDA has not officially
      declared a shortage. Expected to persist through end of 2026, possibly longer.
      Ongoing opportunity for compounded estradiol cream / troche / capsule / gel.

  - label: "Testosterone labeling change (TRAVERSE) + indication expansion"
    keywords: ["testosterone replacement", "TRAVERSE", "hypogonadism", "testosterone label", "idiopathic hypogonadism"]
    note: >
      UPDATE (2026): FDA issued class-wide testosterone labeling changes — TRAVERSE
      results added and cardiovascular boxed-warning language removed. Separately, FDA
      is encouraging sponsors to file sNDAs to expand TRT to low libido in idiopathic
      hypogonadism (contact deadline was Apr 30, 2026). Net tailwind for the TRT line.

  - label: "Methylene blue — serotonin-syndrome boxed warning vs. wellness sales"
    keywords: ["methylene blue"]
    note: >
      Status ongoing (Aug 2026): FDA-labeled boxed warning for fatal serotonin syndrome
      with SSRIs/SNRIs/MAOIs still stands; FDA treats methylene blue supplements as
      unapproved new drugs and has issued warning letters over health claims. Booming
      off-label wellness demand carries real interaction risk — counsel on concomitant
      antidepressants.
